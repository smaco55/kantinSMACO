<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk - Kantin Digital</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="theme-color" content="#14532d"><link rel="stylesheet" href="css/app.css?v=20261125a"><script src="config.js"></script><script src="js/core.js?v=20261125a"></script></head>
<body><div class="lg">
 <section class="lg-l" id="idn"><div class="ph" id="idPh">K</div><img id="idLogo" class="hide" alt="Logo sekolah"><h1 id="idSek">Kantin Digital</h1><h2 id="idKan"></h2><p id="idAlm" class="ad"></p><p id="idTel"></p></section>
 <section class="lg-r">
  <div class="lg-box" id="fLogin"><h3>Selamat datang</h3><p class="sub">Masuk dengan akun yang diberikan sekolah.</p>
   <label for="uid">Username</label><input type="text" id="uid" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Pelanggan: alamat email" autofocus>
   <label for="pw">Password</label><div class="pw"><input type="password" id="pw" autocomplete="current-password"><button type="button" id="tg1">Tampilkan</button></div>
   <label for="hak">Hak Akses</label>
   <select id="hak"><option value="kepala">Kepala Kantin / Admin</option><option value="bendahara">Bendahara</option><option value="kasir">Kasir</option><option value="pencatat">Petugas Pencatat / Gudang</option><option value="pelanggan">Pelanggan</option><option value="wali">Orang Tua (Wali)</option></select>
   <button class="btn" id="bLogin">Masuk</button></div>
  <div class="lg-box hide" id="fAkt"><h3>Aktivasi akun</h3><p class="sub" id="aktInfo">Demi keamanan, buat password baru untuk akun Anda.</p>
   <label for="p1">Password baru</label><div class="pw"><input type="password" id="p1" autocomplete="new-password" placeholder="Minimal 4 karakter"><button type="button" id="tg2">Tampilkan</button></div>
   <label for="p2">Ulangi password baru</label><input type="password" id="p2" autocomplete="new-password">
   <div id="pinBox" class="hide"><label for="n1">PIN transaksi (6 angka)</label><input type="password" id="n1" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="● ● ● ● ● ●"><label for="n2">Ulangi PIN</label><input type="password" id="n2" inputmode="numeric" maxlength="6" autocomplete="off">
    <p class="mu" style="font-size:12.5px;margin:8px 0 0">PIN dipakai untuk konfirmasi setiap transaksi. Rahasiakan, jangan berikan kepada siapa pun. Tidak boleh 123456 atau angka berurutan.</p></div>
   <button class="btn" id="bAkt">Simpan dan masuk</button></div>
 </section></div><div id="toast"></div>
<script>
const $i=id=>document.getElementById(id);
function pasangIdentitas(c){if(!c)return;applyTheme(c);
  $i('idSek').textContent=c.nama_sekolah||c.nama_kantin||'Kantin Digital';$i('idKan').textContent=c.nama_sekolah?(c.nama_kantin||''):'';
  $i('idAlm').textContent=c.alamat||'';$i('idTel').textContent=c.telepon?'Telp. '+c.telepon:'';
  const l=$i('idLogo');if(c.logo){l.src=c.logo;l.classList.remove('hide');$i('idPh').classList.add('hide');}else{l.classList.add('hide');$i('idPh').classList.remove('hide');$i('idPh').textContent=(c.nama_kantin||'K').trim().charAt(0).toUpperCase();}
  document.title='Masuk - '+(c.nama_kantin||'Kantin Digital');}
try{pasangIdentitas(JSON.parse(localStorage.getItem('theme')));}catch(e){}
// identitas terbaru dari server (tanpa login)
fetch(API_URL+'?full=1').then(r=>r.json()).then(j=>{if(j&&(j.nama||j.nama_kantin)){const c=Object.assign(cfgNow(),{nama_kantin:j.nama_kantin||j.nama,nama_sekolah:j.nama_sekolah,alamat:j.alamat,telepon:j.telepon,warna_utama:j.warna_utama,logo:j.logo});pasangIdentitas(c);}}).catch(()=>{});
$i('hak').value=localStorage.getItem('hak')||'kepala';
let lama='',grup='';
const go=()=>{location.href=homeUrl();};
function toggle(btn,ids){btn.onclick=()=>{const t=$i(ids[0]).type==='password';ids.forEach(i=>$i(i).type=t?'text':'password');btn.textContent=t?'Sembunyikan':'Tampilkan';};}
toggle($i('tg1'),['pw']);toggle($i('tg2'),['p1','p2']);
['n1','n2'].forEach(i=>$i(i).addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,6)));
$i('uid').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$i('pw').focus();}});
$i('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$i('bLogin').click();});
$i('hak').addEventListener('keydown',e=>{if(e.key==='Enter')$i('bLogin').click();});
$i('bLogin').onclick=e=>run(e.target,async()=>{
  const r=await api('login',{username:$i('uid').value.trim(),password:$i('pw').value,hak:$i('hak').value});
  localStorage.setItem('hak',$i('hak').value);
  sessionStorage.setItem('tok',r.token);sessionStorage.setItem('role',r.role);sessionStorage.setItem('grup',r.grup);sessionStorage.setItem('hak',r.hak);sessionStorage.setItem('nama',r.nama);sessionStorage.setItem('izin',JSON.stringify(r.izin||[]));
  if(r.gantiPassword||r.gantiPin){lama=$i('pw').value;grup=r.grup;$i('fLogin').classList.add('hide');$i('fAkt').classList.remove('hide');
    if(r.gantiPin){$i('pinBox').classList.remove('hide');$i('aktInfo').textContent='Ini login pertama Anda. Buat password baru dan PIN transaksi pribadi.';}$i('p1').focus();}
  else go();});
$i('bAkt').onclick=e=>run(e.target,async()=>{const n=$i('p1').value,pin=$i('n1').value;
  if(n.length<4)throw new Error('Password minimal 4 karakter');if(n!==$i('p2').value)throw new Error('Ulangi password tidak sama');
  if(grup==='pelanggan'){if(!/^\d{6}$/.test(pin))throw new Error('PIN harus 6 angka');if(pin!==$i('n2').value)throw new Error('Ulangi PIN tidak sama');}
  await api('aktivasi',{lama,baru:n,pinBaru:pin});toast('Akun berhasil diaktifkan');setTimeout(go,600);});
</script></body></html>
