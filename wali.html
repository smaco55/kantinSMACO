<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orang Tua</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="theme-color" content="#14532d"><link rel="stylesheet" href="css/app.css"><script src="config.js"></script><script src="js/core.js"></script>
<style>main{max-width:640px}label{display:block;margin:8px 0 3px;color:var(--mu);font-size:14px}.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.chips button{flex:none;padding:10px 16px;border:1px solid var(--bd);border-radius:2px;background:#fff;font-size:15px}.chips button.on{background:var(--g);color:var(--on);border-color:var(--g)}
h4{margin:12px 0 4px;color:var(--gd)}</style></head>
<body><header><img id="hdrLogo" class="hide" alt=""><b id="hdrName">Orang Tua</b><button onclick="logout()">Keluar</button></header>
<main><div id="kids" class="chips"></div>
<div id="kid" class="hide"><div class="card"><div class="mu" id="kn"></div><div class="mu">Sisa saldo</div><div class="big" id="ks"></div><div id="kw"></div></div>
<nav id="tabs" style="margin:8px -10px"><button data-t="jajan" class="on">Jajan</button><button data-t="dep">Deposit</button><button data-t="bts">Batas harian</button><button data-t="akun">Akun</button></nav>
<section id="t-jajan"><div id="jj"></div></section><section id="t-dep" class="hide"><div id="dd"></div></section>
<section id="t-bts" class="hide"><div class="card"><div class="row"><span>Batas sekolah</span><b id="bs"></b></div><div class="row"><span>Batas yang Anda atur</span><b id="bm"></b></div>
 <label>Batas jajan harian baru (Rp). Isi 0 untuk mengikuti batas sekolah.</label><input type="number" id="bn" inputmode="numeric"><button class="btn" id="bSave" style="margin-top:8px">Simpan batas</button>
 <p class="mu">Anda hanya dapat menurunkan batas, tidak melebihi batas sekolah. Jika terlampaui, transaksi ditolak di kasir.</p></div></section>
<section id="t-akun" class="hide"><div class="card" id="nt" style="margin-bottom:10px"></div></section></div>
<p id="empty" class="mu hide">Belum ada anak yang terkait dengan akun ini. Hubungi Kepala Kantin.</p></main>
<div id="toast"></div><script src="js/wali.js"></script></body></html>
