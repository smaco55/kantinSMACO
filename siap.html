<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pesanan Siap</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="theme-color" content="#14532d"><link rel="stylesheet" href="css/app.css"><script src="config.js"></script><script src="js/core.js"></script>
<style>body{background:var(--gl);min-height:100vh}header{justify-content:center;text-align:center}header b{flex:none;font-size:clamp(20px,4vw,34px)}
h1{text-align:center;color:var(--gd);font-size:clamp(22px,4vw,40px);margin:18px 10px 8px}
#n{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:14px;max-width:1300px;margin:auto}
.no{background:#fff;border:4px solid var(--g);border-radius:20px;text-align:center;font-weight:800;font-size:clamp(48px,9vw,110px);color:var(--g);padding:14px 0}
.no.new{background:var(--g);color:var(--on);animation:p 1s 4}@keyframes p{50%{transform:scale(1.07)}}
#e{text-align:center;color:var(--mu);font-size:clamp(18px,3vw,28px);padding:40px}#st{position:fixed;right:10px;bottom:8px;font-size:13px;color:var(--mu)}
#ct{position:fixed;left:10px;bottom:8px;display:flex;gap:6px}#ct button{padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:#fff}</style></head>
<body><header><img id="hdrLogo" class="hide" alt=""><b id="hdrName">Pesanan Siap</b></header>
<h1>Pesanan siap diambil</h1><div id="n"></div><div id="e" class="hide">Belum ada pesanan yang siap</div>
<div id="ct"><button id="bs">🔔 Bunyi: mati</button><button id="bf">⛶ Layar penuh</button></div><div id="st"></div>
<script>
let prev=new Set(),snd=false,ac=null;
const beep=()=>{if(!snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(ac.currentTime+.25);}catch(e){}};
$('#bs').onclick=()=>{snd=!snd;$('#bs').textContent='🔔 Bunyi: '+(snd?'aktif':'mati');if(snd)beep();};
$('#bf').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});};
function show(l){const cur=new Set(l),baru=l.filter(x=>!prev.has(x));
  $('#n').innerHTML=l.map(x=>`<div class="no ${baru.includes(x)&&prev.size+baru.length>0&&!first?'new':''}">${esc(x)}</div>`).join('');
  $('#e').classList.toggle('hide',l.length>0);if(baru.length&&!first)beep();prev=cur;first=false;}
let first=true;
async function get(full){const r=await fetch(API_URL+(full?'?full=1':''));const j=await r.json();if(!j.ok)throw new Error('gagal');
  if(full){applyTheme({warna_utama:j.warna_utama,nama_kantin:j.nama||'Pesanan Siap',logo:j.logo});}
  show(j.siap.slice().sort((a,b)=>a-b));$('#st').textContent='Diperbarui '+new Date().toLocaleTimeString('id-ID');}
get(true).catch(()=>$('#st').textContent='Menghubungkan…');
setInterval(()=>get(false).catch(()=>{$('#st').textContent='Koneksi terputus, mencoba lagi…';}),8000);
</script></body></html>
