<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kantin</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="theme-color" content="#14532d"><link rel="stylesheet" href="css/app.css"><script src="config.js"></script><script src="js/core.js"></script>
<style>main{max-width:640px;padding-bottom:90px}label{display:block;margin:8px 0 3px;color:var(--mu);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chips button{flex:none;padding:9px 14px;border:1px solid var(--bd);border-radius:99px;background:#fff;font-size:15px}.chips button.on{background:var(--g);color:var(--on);border-color:var(--g)}.chips button:disabled{opacity:.4}
.sal{background:var(--on);color:var(--g);border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px;background:#fff;border-top:1px solid var(--bd);z-index:6}
.qn{display:flex;align-items:center;gap:6px;margin-top:6px}.qn button{width:34px;height:34px;border:1px solid var(--bd);border-radius:8px;background:#fff;font-size:18px}
.siap{border:2px solid var(--ok);background:#ecfdf3}.ant{font-size:34px;font-weight:800;color:var(--g)}</style></head>
<body><header><img id="hdrLogo" class="hide" alt=""><b id="hdrName">Kantin</b><span class="sal" id="saldoH"></span><button onclick="logout()">Keluar</button></header>
<nav id="tabs"><button data-t="pesan" class="on">Pesan</button><button data-t="pes">Pesananku</button><button data-t="saldo">Saldo</button></nav>
<main>
<section id="t-pesan"><div id="info"></div><label>Ambil pada</label><div class="chips" id="dates"></div>
 <input type="search" id="cari" placeholder="Cari makanan atau minuman…" style="margin-top:6px"><div class="chips" id="cats"></div><div class="grid" id="grid"></div></section>
<section id="t-pes" class="hide"><div id="pesL"></div><button class="btn alt hide" id="pesMore" style="margin-top:8px">Muat lagi</button></section>
<section id="t-saldo" class="hide"><div class="card"><div class="mu">Sisa saldo</div><div class="big" id="saldoB"></div><div id="saldoW"></div><p class="mu">Isi saldo dengan menyerahkan uang tunai ke bendahara.</p></div>
 <h3>Riwayat deposit</h3><div id="depL"></div>
 <div class="card" style="margin-top:12px"><h3 style="margin-top:0">Ganti PIN</h3><input type="password" id="pl" inputmode="numeric" placeholder="PIN lama" maxlength="6"><input type="password" id="pb" inputmode="numeric" placeholder="PIN baru (6 angka)" maxlength="6" style="margin-top:6px"><button class="btn" id="bPin" style="margin-top:8px">Simpan PIN</button></div></section>
</main>
<div class="bar hide" id="bar"><button class="btn" id="bCart"></button></div>
<dialog id="dC"><h3 style="margin-top:0">Pesananmu</h3><div id="cl"></div><div class="row"><b>Total</b><span class="big" id="ct"></span></div><div class="mu" id="cs"></div>
 <button class="btn" id="bOk" style="margin-top:10px">Pesan sekarang</button><button class="btn alt" id="bBack" style="margin-top:8px">Kembali</button></dialog>
<dialog id="dD"><div id="dDb" style="text-align:center"></div><button class="btn" id="bDone" style="margin-top:10px">Selesai</button></dialog>
<div id="toast"></div><script src="js/pelanggan.js"></script></body></html>
