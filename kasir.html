<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kasir</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="theme-color" content="#14532d"><link rel="stylesheet" href="css/app.css"><script src="config.js"></script><script src="js/core.js"></script></head>
<body><header><img id="hdrLogo" class="hide" alt=""><b id="hdrName">Kasir</b><span class="who" id="clk"></span><button onclick="logout()">Keluar</button></header>
<nav id="tabs"><button data-t="jual" class="on">Penjualan</button><button data-t="antre">Antrean pre-order</button><button data-t="stok">Barang habis</button><button data-t="tutup">Tutup kasir</button></nav>
<main class="wide">
<section id="t-jual"><div class="pos">
 <div class="pos-l">
  <div class="scanbar"><label>SCAN KARTU PELANGGAN &nbsp;<kbd>F2</kbd></label><input type="text" id="scan" placeholder="Arahkan barcode scanner ke kartu…" autocomplete="off" inputmode="none"></div>
  <div class="toolbar"><input type="search" id="cari" placeholder="Cari barang…  (F3)"><button class="btn alt sm" id="bManual">Kartu lupa / manual</button><button class="btn alt sm hide" id="bLast">Batalkan transaksi terakhir</button></div>
  <div id="manual" class="card hide" style="margin-bottom:6px"><div class="warn" style="margin-top:0">Input manual dicatat di log. Pelanggan wajib memasukkan passwordnya.</div>
   <input type="search" id="cariM" placeholder="Nama atau username/NIS"><div id="hasilM"></div>
   <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="susulan" style="width:auto"> Mode darurat (internet bermasalah, input susulan)</label></div>
  <div class="grid" id="grid"></div></div>
 <div class="pos-r">
  <div id="cust" class="cust hide"></div>
  <div class="card" style="padding:0"><div class="wrap" id="cart"></div></div>
  <div class="totbar"><span>TOTAL</span><b id="total">Rp0</b></div>
  <div class="pay"><button class="btn" id="bOk" disabled>KONFIRMASI <kbd>F8</kbd></button><button class="btn alt" id="bBatal">Batal <kbd>Esc</kbd></button></div>
 </div></div></section>
<section id="t-antre" class="hide"><input type="search" id="fa" placeholder="Cari nomor antrean atau nama"><div id="antre"></div></section>
<section id="t-stok" class="hide"><div id="stok"></div></section>
<section id="t-tutup" class="hide"><div class="card" style="max-width:420px"><button class="btn" id="bTutup">Lihat ringkasan shift saya</button><div id="ringkas"></div></div></section>
</main>
<dialog id="dPin"><h3 style="margin-top:0">Password pelanggan</h3><p class="mu" style="margin-top:0">Minta pelanggan mengetik passwordnya sendiri.</p><input type="password" id="pinIn" autocomplete="off"><button class="btn" id="bPinOk" style="margin-top:10px">Lanjut</button><button class="btn alt" id="bPinX" style="margin-top:6px">Batal</button></dialog>
<dialog id="dStruk"><div id="struk"></div><button class="btn" id="bCetak" style="margin-top:10px">Cetak Struk</button><button class="btn alt" id="bTutupS" style="margin-top:6px">Selesai</button></dialog>
<div id="toast"></div><script src="js/kasir.js"></script></body></html>
